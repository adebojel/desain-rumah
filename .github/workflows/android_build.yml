name: Auto Build Desain Rumah V53 APK & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x ./gradlew

    - name: Configure Clean Android SDK Environment
      run: |
        # Buat file local.properties secara otomatis di server dengan path SDK bawaan runner Ubuntu
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
        
        # Bersihkan cache transform gradle yang menyimpan path termux
        rm -rf ~/.gradle/caches/transforms-*
        rm -rf ~/.gradle/caches/modules-*

    - name: Build Debug APK
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      run: |
        ./gradlew clean assembleDebug --no-daemon --refresh-dependencies

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-v53
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Auto Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/heads/main')
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        tag_name: v1.53.0-${{ github.run_number }}
        name: "Desain Rumah V53 Build #${{ github.run_number }}"
        body: "Automated build release containing 63 AI models integration for Desain Rumah V53."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
