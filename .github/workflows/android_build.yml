name: Auto Build Desain Rumah V53 APK & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x ./gradlew

    - name: Setup Android SDK and Build Tools Manually
      env:
        ANDROID_HOME: /opt/android-sdk
        ANDROID_SDK_ROOT: /opt/android-sdk
      run: |
        sudo mkdir -p /opt/android-sdk
        sudo chown -R $USER:$USER /opt/android-sdk
        
        # Download Android command-line tools
        CMDLINES_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
        wget -q $CMDLINES_URL -O cmdlines.zip
        mkdir -p temp_cmdlines
        unzip -q cmdlines.zip -d temp_cmdlines
        mkdir -p /opt/android-sdk/cmdline-tools
        mv temp_cmdlines/cmdline-tools /opt/android-sdk/cmdline-tools/latest
        rm -rf cmdlines.zip temp_cmdlines

        # Set PATH
        echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
        echo "/opt/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "/opt/android-sdk/platform-tools" >> $GITHUB_PATH

        # Accept licenses and install platform 34 & build-tools 34.0.0
        export PATH=$PATH:/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Build Debug APK with Self-Contained SDK
      env:
        ANDROID_HOME: /opt/android-sdk
        ANDROID_SDK_ROOT: /opt/android-sdk
      run: |
        rm -f local.properties
        export PATH=$PATH:/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools
        ./gradlew clean assembleDebug --no-daemon --refresh-dependencies

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-v53
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Auto Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/heads/main')
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        tag_name: v1.53.0-${{ github.run_number }}
        name: "Desain Rumah V53 Build #${{ github.run_number }}"
        body: "Automated build release containing 63 AI models integration for Desain Rumah V53."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
