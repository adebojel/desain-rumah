name: Auto Build Desain Rumah V53 APK & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Debug APK with Manual SDK Config
      env:
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      run: |
        export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
        
        # Accept licenses safely without legacy tools package
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

        if [ ! -f ./gradlew ]; then
          gradle wrapper --gradle-version 8.5
        fi
        chmod +x ./gradlew
        ./gradlew clean assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-v53
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Auto Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/heads/main')
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        tag_name: v1.53.0-${{ github.run_number }}
        name: "Desain Rumah V53 Build #${{ github.run_number }}"
        body: "Automated build release containing 63 AI models integration for Desain Rumah V53."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
